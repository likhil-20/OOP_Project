server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/i_itsm_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
