   services:
     db:
       image: postgres:16
       environment:
         POSTGRES_USER: itsm
         POSTGRES_PASSWORD: itsm123
         POSTGRES_DB: itsmdb
       ports:
         - "5432:5432"
       volumes:
         - pgdata:/var/lib/postgresql/data

     backend:
       build: ./i-itsm-project/backend
       ports:
         - "8080:8080"
       environment:
         SPRING_DATASOURCE_URL: ${DB_URL}
         SPRING_DATASOURCE_USERNAME: ${DB_USER}
         SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

     frontend:
       build: ./i-itsm-project/frontend
       ports:
         - "3000:3000"
       environment:
         CHOKIDAR_USEPOLLING: "true"
         WATCHPACK_POLLING: "true"
       volumes:
         - ./i-itsm-project/frontend:/app
         - /app/node_modules
       depends_on:
         - backend

   volumes:
     pgdata: