services:
  # Only starts when you use: --profile local
  db:
    image: postgres:18-alpine
    profiles: ["local"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm123
      POSTGRES_DB: itsmdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsmdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./i-itsm-project/backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Kolkata
    mem_limit: 640m

  frontend:
    build: ./i-itsm-project/frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    mem_limit: 64m
    depends_on:
      - backend

volumes:
  pgdata:
